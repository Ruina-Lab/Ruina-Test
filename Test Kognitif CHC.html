<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lab Kognitif CHC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Konsep: berkas kasus laboratorium forensik. Kertas dingin, tinta navy, label mono, satu aksen teal, pita kuning bukti dipakai hemat. */
:root{
  --bg:#E8EDF0; --paper:#F7F9FA; --paper2:#EDF1F3; --ink:#12212B; --ink2:#3A4C58; --muted:#5F7380;
  --line:#C3CED5; --accent:#0A7487; --accent-ink:#FFFFFF; --accent-soft:#D5EBEF;
  --tag:#E8B923; --tag-ink:#2B2200; --warn:#9A4B00; --warn-soft:#F6E6D2;
  --cube-t:#8FD0DA; --cube-l:#52A9B8; --cube-r:#2F7F8E;
  --font-d:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D151A; --paper:#14202A; --paper2:#1A2A35; --ink:#E7EEF2; --ink2:#B9C8D1; --muted:#8CA1AE;
    --line:#2C404D; --accent:#4DC2D4; --accent-ink:#06222A; --accent-soft:#15363E;
    --tag:#E8B923; --tag-ink:#2B2200; --warn:#F0B070; --warn-soft:#3A2A16;
    --cube-t:#7FD6E4; --cube-l:#44A4B4; --cube-r:#2A7886; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D151A; --paper:#14202A; --paper2:#1A2A35; --ink:#E7EEF2; --ink2:#B9C8D1; --muted:#8CA1AE;
  --line:#2C404D; --accent:#4DC2D4; --accent-ink:#06222A; --accent-soft:#15363E;
  --tag:#E8B923; --tag-ink:#2B2200; --warn:#F0B070; --warn-soft:#3A2A16;
  --cube-t:#7FD6E4; --cube-l:#44A4B4; --cube-r:#2A7886; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-b);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5.4vw,42px);font-weight:700}
h2{font-size:clamp(22px,3.6vw,28px);font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px/1.3 var(--font-m);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--font-m)}
.muted{color:var(--muted)}
.lead{font-size:18px;color:var(--ink2);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-l{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--tag);color:var(--tag-ink);font:500 11px/1 var(--font-m);letter-spacing:.08em;padding:5px 7px;border-radius:2px;text-transform:uppercase}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 10px;margin-bottom:24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:600 15px var(--font-d)}
.segs{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex:1;min-width:140px;max-width:360px}
.segs li{flex:1;height:6px;background:var(--line);border-radius:1px}
.segs li.done{background:var(--accent)}
.segs li.cur{background:var(--tag)}
.save{font:400 12px var(--font-m);color:var(--muted)}

/* surfaces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:24px}
.card.flat{background:transparent}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* buttons */
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 16px var(--font-b);
  padding:12px 20px;border-radius:3px;cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

/* items */
.item{display:flex;flex-direction:column;gap:20px}
.item-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.q{font-size:19px;line-height:1.45;max-width:62ch;white-space:pre-line}
.q b{font-weight:600}
.stim{display:flex;justify-content:center;padding:8px 0}
.stim svg{max-width:100%;height:auto}
.opts{display:grid;gap:10px}
.opts.c1{grid-template-columns:1fr}
.opts.c2{grid-template-columns:repeat(2,1fr)}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{appearance:none;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:3px;
  padding:12px 14px;font:400 16px/1.4 var(--font-b);cursor:pointer;display:flex;gap:12px;align-items:center;min-height:50px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .k{font:500 12px var(--font-m);color:var(--muted);border:1px solid var(--line);border-radius:2px;width:24px;height:24px;display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.vis{justify-content:center;padding:8px}
.opt.vis .k{position:absolute;top:6px;left:6px}
.opt.vis{position:relative}
.opt svg{max-width:100%;height:auto;display:block}
@media (max-width:520px){.opts.c3{grid-template-columns:repeat(2,1fr)}}

.timer{height:6px;background:var(--line);border-radius:1px;overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.big{font:500 clamp(48px,14vw,96px)/1 var(--font-m);text-align:center;letter-spacing:.04em;min-height:1.1em}
.bigbox{border:1px solid var(--line);background:var(--paper2);border-radius:4px;padding:28px 12px;display:grid;place-items:center;min-height:160px}
.field{font:500 24px var(--font-m);padding:12px 14px;border:1.5px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);width:100%;max-width:360px;letter-spacing:.12em}
.field:focus{outline:3px solid var(--tag);outline-offset:1px;border-color:var(--accent)}
textarea.field{font:400 17px/1.5 var(--font-b);letter-spacing:0;max-width:100%;min-height:200px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.pad button{min-height:56px;font:500 22px var(--font-m);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;cursor:pointer}
.pad button:hover{border-color:var(--accent)}
.legend{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper)}
.legend div{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-right:1px solid var(--line);gap:2px}
.legend div:last-child{border-right:0}
.legend span{font:500 14px var(--font-m);color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp div{font:500 clamp(22px,6vw,36px) var(--font-m);letter-spacing:.14em;text-align:center;padding:22px 6px;background:var(--paper2);border:1px solid var(--line);border-radius:3px}
.corsi{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;background:var(--paper2);border:1px solid var(--line);border-radius:4px}
.corsi button{position:absolute;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid var(--ink2);background:var(--line);border-radius:3px;cursor:pointer;padding:0}
.corsi button.on{background:var(--tag);border-color:var(--tag)}
.corsi button.hit{background:var(--accent);border-color:var(--accent)}
.notice{border:1px solid var(--line);background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:12px 14px;font-size:15px}
.notice b{color:var(--warn)}

/* result */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font:600 34px/1 var(--font-d);font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(96px,150px) 1fr 52px;gap:10px;align-items:center;font-size:14px}
.hb .nm{color:var(--ink);line-height:1.25}
.hb .nm small{display:block;color:var(--muted);font:400 11px var(--font-m);letter-spacing:.04em}
.hb .tr{position:relative;height:22px;background:var(--paper2);border-radius:2px}
.hb .fl{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0}
.hb .ci{position:absolute;top:50%;height:2px;background:var(--ink);transform:translateY(-50%);opacity:.85}
.hb .ci::before,.hb .ci::after{content:"";position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.hb .ci::before{left:0}.hb .ci::after{right:0}
.hb .val{font:500 14px var(--font-m);text-align:right;font-variant-numeric:tabular-nums}
.hb.sm{grid-template-columns:minmax(110px,190px) 1fr 44px;font-size:13px}
.hb.sm .tr{height:12px}
.hb.sm .fl{border-radius:0 3px 3px 0}
.chip{display:inline-block;font:500 12px var(--font-m);letter-spacing:.03em;padding:3px 8px;border-radius:2px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.up{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.dn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.abcard{display:flex;flex-direction:column;gap:14px}
.abhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.abhead .pct{font:600 30px/1 var(--font-d);font-variant-numeric:tabular-nums}
.abcard h4{font:500 12px var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.abcard ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--font-m);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;font-family:var(--font-m)}
.radar text{fill:var(--ink2);font:500 11px var(--font-m)}
.radar text.c{fill:var(--ink);font:600 13px var(--font-d)}
details{border:1px solid var(--line);border-radius:3px;background:var(--paper)}
summary{cursor:pointer;padding:12px 14px;font-weight:600}
details>div{padding:0 14px 14px}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rooms>div{background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:2px}
.rooms b{font:600 16px var(--font-d)}
.rooms span{font-size:14px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.noprint{display:none!important}}
</style>
<div class="wrap"><div id="app"></div></div>
<script>
'use strict';
/* ========== util ========== */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, r = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
const LET = 'ABCDEFGH';

/* ========== state ========== */
const KEY = 'chc-lab-v1';
let ST = { pos: 0, res: {}, started: false, audio: null, learnedAt: null };
function load() { try { const s = localStorage.getItem(KEY); if (s) ST = Object.assign(ST, JSON.parse(s)); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
function wipe() { try { localStorage.removeItem(KEY); } catch (e) {} ST = { pos: 0, res: {}, started: false, audio: null, learnedAt: null }; }

/* ========== screens ========== */
const app = () => $('#app');
function setScreen(...nodes) { app().replaceChildren(...nodes); window.scrollTo(0, 0); }

function header() {
  const segs = STATIONS.map((s, i) => h('li', { class: i < ST.pos ? 'done' : i === ST.pos ? 'cur' : '', title: s.room }));
  return h('header', { class: 'top' },
    h('div', { class: 'top-in' },
      h('div', { class: 'brand' }, h('span', { class: 'tag' }, 'Berkas CHC-09'), 'Lab Kognitif'),
      h('ol', { class: 'segs', 'aria-label': 'Kemajuan: ruang ' + (ST.pos + 1) + ' dari ' + STATIONS.length }, segs),
      h('span', { class: 'save' }, 'Tersimpan otomatis')));
}

function card(...kids) { return h('section', { class: 'card stack' }, ...kids); }

/* ========== MCQ engine ========== */
// item: {q, stim(html|Node), opts:[html|string], a:idx, vis:bool, cols:n, fixed:bool, study:{html,ms,early}, play:fn}
function renderOpt(o) { return typeof o === 'string' ? o : o.html; }

async function askItem(it, i, n, tag) {
  const root = h('div', { class: 'item' });
  const box = h('div', { class: 'stack-l' }, header(), card(root));
  setScreen(box);
  const head = h('div', { class: 'item-h' }, h('span', { class: 'eyebrow' }, tag), h('span', { class: 'eyebrow' }, 'Butir ' + (i + 1) + ' / ' + n));
  if (it.study) {
    root.replaceChildren(head,
      h('p', { class: 'q' }, it.study.prompt || 'Perhatikan baik-baik. Tampilan akan hilang sendiri.'),
      h('div', { class: 'stim', html: it.study.html }),
      h('div', { class: 'timer' }, h('i', { id: 'tbar' })));
    const bar = $('#tbar'); bar.style.transition = 'transform ' + it.study.ms + 'ms linear';
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = 'scaleX(0)'; }));
    if (it.study.early) {
      await new Promise(res => {
        const t = setTimeout(res, it.study.ms);
        root.append(h('div', { class: 'row' }, h('button', { class: 'btn ghost', onclick: () => { clearTimeout(t); res(); } }, 'Sudah selesai membaca')));
      });
    } else await sleep(it.study.ms);
  }
  // shuffle options (keep original index mapping)
  const order = it.fixed ? it.opts.map((_, k) => k) : shuffle(it.opts.map((_, k) => k));
  let sel = null, plays = 0;
  const cols = it.cols || (it.vis ? 2 : 1);
  const optEls = order.map((orig, pos) => {
    const b = h('button', { class: 'opt' + (it.vis ? ' vis' : ''), type: 'button', 'aria-pressed': 'false', onclick: () => {
      sel = orig; optEls.forEach((e, p) => e.setAttribute('aria-pressed', order[p] === orig ? 'true' : 'false')); next.disabled = false;
    } }, h('span', { class: 'k' }, LET[pos]), h('span', { html: renderOpt(it.opts[orig]) }));
    return b;
  });
  const next = h('button', { class: 'btn', disabled: true }, i + 1 < n ? 'Kunci jawaban & lanjut' : 'Kunci jawaban & selesai');
  const parts = [head];
  if (it.q) parts.push(h('p', { class: 'q', html: it.q }));
  if (it.stim) parts.push(h('div', { class: 'stim' }, typeof it.stim === 'string' ? h('div', { html: it.stim }) : it.stim));
  if (it.play) {
    const pb = h('button', { class: 'btn ghost', type: 'button' }, 'Putar suara (maks. 2 kali)');
    pb.onclick = async () => {
      if (plays >= 2) return; plays++;
      pb.disabled = true; const dur = await it.play(); await sleep(dur + 200);
      pb.textContent = plays >= 2 ? 'Pemutaran habis' : 'Putar sekali lagi (sisa ' + (2 - plays) + ')';
      pb.disabled = plays >= 2;
    };
    parts.push(h('div', { class: 'row' }, pb));
  }
  parts.push(h('div', { class: 'opts c' + cols }, optEls));
  parts.push(h('div', { class: 'row' }, next));
  root.replaceChildren(...parts);
  return new Promise(res => { next.onclick = () => res(sel); });
}

async function runMCQ(items, tag) {
  let c = 0, g = 0;
  for (let i = 0; i < items.length; i++) {
    const sel = await askItem(items[i], i, items.length, tag);
    if (sel === items[i].a) c++;
    g += 1 / items[i].opts.length;
  }
  return { c, n: items.length, g: g / items.length };
}

/* ========== generic helpers for custom tasks ========== */
function stageShell(tag, title) {
  const body = h('div', { class: 'stack' });
  setScreen(h('div', { class: 'stack-l' }, header(), card(h('div', { class: 'item-h' }, h('span', { class: 'eyebrow' }, tag), h('span', { class: 'eyebrow' }, title || '')), body)));
  return body;
}
function timerBar(ms) {
  const bar = h('i'); const t = h('div', { class: 'timer' }, bar);
  bar.style.transition = 'transform ' + ms + 'ms linear';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = 'scaleX(0)'; }));
  return t;
}
// show a "ready" card then resolve on click
function ready(body, text, label = 'Mulai') {
  return new Promise(res => {
    body.replaceChildren(h('p', { class: 'q' }, text), h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => res() }, label)));
  });
}
/* ========== GENERATOR: matriks pola (Gf-I) ========== */
function shapeSVG(shape, cx, cy, r, fill) {
  const st = 'stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;' + (fill === 0 ? 'fill:none' : fill === 1 ? 'fill:var(--accent);fill-opacity:.38' : 'fill:var(--accent)');
  if (shape === 0) return `<circle cx="${cx}" cy="${cy}" r="${r}" style="${st}"/>`;
  if (shape === 1) return `<rect x="${cx - r}" y="${cy - r}" width="${2 * r}" height="${2 * r}" style="${st}"/>`;
  const p = [[cx, cy - r * 1.12], [cx + r * 1.08, cy + r * .86], [cx - r * 1.08, cy + r * .86]].map(q => q.map(v => +v.toFixed(1)).join(',')).join(' ');
  return `<polygon points="${p}" style="${st}"/>`;
}
function cellInner(a, ox, oy) {
  const k = a.count + 1, r = [8, 11, 14][a.size];
  let s = '';
  for (let i = 0; i < k; i++) s += shapeSVG(a.shape, ox + 50 + (i - (k - 1) / 2) * 31, oy + 50, r, a.fill);

function textInput(body, { label, mode = 'text', ph = '', cls = 'field' }) {

    const inp = h('input', { class: cls, type: 'text', inputmode: mode, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: ph, 'aria-label': label });

    body.replaceChildren(h('p', { class: 'q' }, label), inp, h('div', { class: 'row' }, h('button', { class: 'btn', onclick: go }, 'Kirim jawaban')));
    inp.focus();
  });
}

async function runSpan({ tag, title, lens, gen, ask, expect, intro }) {
  const body = stageShell(tag, title);
  await ready(body, intro, 'Mulai');
  let c = 0, total = lens.length * 2;
  outer:
  for (const L of lens) {
    let fails = 0;
    for (let t = 0; t < 2; t++) {
      const seq = gen(L);
      bigScreen(body, '·'); await sleep(900);
      for (const s of seq) { bigScreen(body, s); await sleep(850); bigScreen(body, ''); await sleep(250); }
      const ans = await textInput(body, { ...ask(L) });
      const norm = v => v.replace(/[^0-9A-Za-z]/g, '').toUpperCase();
      if (norm(ans) === norm(expect(seq))) c++; else fails++;
    }
    if (fails === 2) break outer;
  }
  return { c, n: total, g: 0 };
}

async function runNBack() {
  const L = 'BFKMRTXZ'.split(''), N = 24, targets = new Set(shuffle([...Array(N - 2).keys()].map(i => i + 2)).slice(0, 8));
  const seq = [];
  for (let i = 0; i < N; i++) {
    if (i >= 2 && targets.has(i)) seq.push(seq[i - 2]);
    else { let x; do { x = pick(L); } while (i >= 2 && x === seq[i - 2]); seq.push(x); }
  }
  const body = stageShell('Gwm · AC', '2-back');
  await ready(body, 'Huruf akan muncul satu per satu. Untuk setiap huruf, putuskan: apakah SAMA dengan huruf dua langkah sebelumnya? (Dua huruf pertama tidak perlu dijawab.) Tidak ada batas waktu per huruf, tapi jangan dicatat.', 'Mulai');
  let hit = 0, cr = 0, nt = 0, nn = 0;
  for (let i = 0; i < N; i++) {
    bigScreen(body, seq[i]);
    if (i < 2) { body.append(h('p', { class: 'muted', style: 'text-align:center' }, 'Ingat huruf ini…')); await sleep(1600); continue; }
    const isT = seq[i] === seq[i - 2];
    const resp = await new Promise(res => body.append(h('div', { class: 'row', style: 'justify-content:center' },
      h('button', { class: 'btn', onclick: () => res(true) }, 'Sama (2 langkah lalu)'), h('button', { class: 'btn ghost', onclick: () => res(false) }, 'Beda'))));
    if (isT) { nt++; if (resp) hit++; } else { nn++; if (!resp) cr++; }
    bigScreen(body, ''); await sleep(250);
  }
  const bal = (hit / nt + cr / nn) / 2;
  return { c: bal * 22, n: 22, g: .5 * 22 / 22, ne: 22 };
}

async function runFluency({ tag, title, intro, prompt, ms, ref, valid }) {
  const body = stageShell(tag, title);
  await ready(body, intro, 'Mulai (' + ms / 1000 + ' detik)');
  const ta = h('textarea', { class: 'field', 'aria-label': 'jawaban', placeholder: 'Pisahkan dengan Enter atau koma…' });
  const info = h('span', { class: 'muted mono' }, '0 jawaban');
  body.replaceChildren(h('p', { class: 'q', html: prompt }), timerBar(ms), ta, info);
  ta.focus();
  const upd = () => { info.textContent = parseEntries(ta.value, valid).length + ' jawaban valid'; };
  ta.addEventListener('input', upd);
  await sleep(ms); ta.disabled = true;
  const n = parseEntries(ta.value, valid).length;
  await ready(body, 'Waktu habis. ' + n + ' jawaban valid tercatat.', 'Lanjut');
  return { c: Math.min(n, ref), n: ref, g: 0, ne: 10 };
}
function parseEntries(txt, valid) {
  const seen = new Set();
  txt.split(/[\n,;]+/).map(s => s.trim().toLowerCase().replace(/\s+/g, ' ')).forEach(s => { if (s.length >= 3 && (!valid || valid(s))) seen.add(s); });
  return [...seen];
}

const SCALE = [261.63, 293.66, 329.63, 349.23, 392, 440, 493.88, 523.25];
function pitchItems() {
  return [200, 100, 50, 28, 16].map(cents => {
    const base = pick([330, 370, 440, 494, 523]), hi = base * Math.pow(2, cents / 1200), firstHigher = Math.random() < .5;
    const [f1, f2] = firstHigher ? [hi, base] : [base, hi];
    return { q: 'Dengarkan dua nada berurutan. Nada mana yang <b>lebih tinggi</b>?', opts: ['Nada pertama', 'Nada kedua'], a: firstHigher ? 0 : 1, fixed: true, cols: 2,
      play: () => AU.playTones([{ f: f1, at: 0, dur: 650 }, { f: f2, at: 1050, dur: 650 }]) };
  });
}
function rhythmItems() {
  const R = mulberry(777), spec = [[4, 0, [250, 500]], [5, 1, [250, 500]], [5, 1, [250, 500]], [6, 0, [250, 500]], [7, 0, [200, 300, 450]], [7, 1, [200, 300, 450]]];
  return spec.map(([k, same, vals]) => {
    let base; do { base = [...Array(k - 1)].map(() => pick(vals, R)); } while (new Set(base).size < 2);
    const other = base.slice();
    if (!same) { const i = base.findIndex((v, j) => j < base.length - 1 && v !== base[j + 1]); [other[i], other[i + 1]] = [other[i + 1], other[i]]; }
    const play = () => {
      const list = []; let t = 0;
      const add = iv => { list.push({ f: 880, at: t, dur: 70 }); iv.forEach(d => { t += d; list.push({ f: 880, at: t, dur: 70 }); }); };
      add(base); t += 1500; add(other); return AU.playTones(list);
    };
    return { q: 'Dengarkan dua pola ketukan. Apakah keduanya <b>sama persis</b> (ritme dan jeda)?', opts: ['Sama', 'Berbeda'], a: same ? 0 : 1, fixed: true, cols: 2, play };
  });
}
function melodyItems() {
  const R = mulberry(4242), spec = [[3, 0, 3], [4, 1, 0], [5, 0, 2], [5, 1, 0], [6, 1, 0], [7, 0, 1]];
  return spec.map(([k, same, shift]) => {
    const m = [2 + Math.floor(R() * 4)];
    while (m.length < k) { const d = pick([-2, -1, 1, 2], R), v = clamp(m[m.length - 1] + d, 0, 7, 0); m.push(v); }
    const o = m.slice();
    if (!same) { const i = 1 + Math.floor(R() * (k - 1)), d = shift === 3 ? 3 : shift === 2 ? 2 : 1; const up = o[i] + d <= 7; o[i] = up ? o[i] + d : o[i] - d; }
    const play = () => {
      const list = []; m.forEach((v, i) => list.push({ f: SCALE[v], at: i * 520, dur: 440 }));
      const off = k * 520 + 1500; o.forEach((v, i) => list.push({ f: SCALE[v], at: off + i * 520, dur: 440 }));
      return AU.playTones(list);
    };
    return { q: 'Dengarkan dua melodi pendek. Apakah keduanya <b>sama persis</b>?', opts: ['Sama', 'Berbeda'], a: same ? 0 : 1, fixed: true, cols: 2, play };
  });
}

function compute() {

  }
  for (const a in abs) {
    const A = abs[a], k = A.nars.length;
    A.p = A.nars.reduce((s, x) => s + x.p, 0) / k;
    A.se = Math.sqrt(A.nars.reduce((s, x) => s + x.se * x.se, 0)) / k;

  const list = ORDER.filter(a => abs[a]).map(a => abs[a]);
  const m = list.length ? list.reduce((s, x) => s + x.p, 0) / list.length : 0;
  list.forEach(A => { A.d = A.p - m; A.thr = Math.max(.07, 1.28 * A.se); A.rel = A.d > A.thr ? 'up' : A.d < -A.thr ? 'dn' : 'eq'; });
  return { list, abs, mean: m };
}

function radarSVG(list) {
  const N = list.length, cx = 210, cy = 200, R = 108, ang = i => -Math.PI / 2 + i * 2 * Math.PI / N;

  let s = '';
  [.25, .5, .75, 1].forEach(f => { s += `<polygon points="${list.map((_, i) => pt(i, R * f).map(v => v.toFixed(1)).join(',')).join(' ')}" style="fill:none;stroke:var(--line);stroke-width:1"/>`; });
  list.forEach((_, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line);stroke-width:1"/>`; });
  [.5, 1].forEach(f => { s += `<text x="${cx + 4}" y="${(cy - R * f + 3).toFixed(1)}" style="font-size:9px">${f * 100}%</text>`; });
  s += `<polygon points="${list.map((a, i) => pt(i, R * a.p).map(v => v.toFixed(1)).join(',')).join(' ')}" style="fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2;stroke-linejoin:round"/>`;
  list.forEach((a, i) => { const [x, y] = pt(i, R * a.p); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" style="fill:var(--accent);stroke:var(--paper);stroke-width:2"><title>${a.ab} ${AB[a.ab].name}: ${pct(a.p)}%</title></circle>`; });
  list.forEach((a, i) => {
    const [x, y] = pt(i, R + 22), c = Math.cos(ang(i)), anchor = c > .3 ? 'start' : c < -.3 ? 'end' : 'middle';
    s += `<text class="c" x="${x.toFixed(1)}" y="${(y + 1).toFixed(1)}" text-anchor="${anchor}">${a.ab}</text><text x="${x.toFixed(1)}" y="${(y + 13).toFixed(1)}" text-anchor="${anchor}" style="font-size:10px">${pct(a.p)}%</text>`;
  });
  return `<svg class="radar" viewBox="0 0 420 400" width="100%" style="max-width:440px" role="img" aria-label="Radar profil kemampuan CHC">${s}</svg>`;
}

        h('p', null, 'Rentang 90% memakai galat baku binomial per kemampuan sempit, digabung ke tingkat luas. Perkiraan ini lebar karena butirnya sedikit per kemampuan sempit.'),
        h('p', null, 'Label "kekuatan relatif" dan "area pengembangan" muncul bila selisih dari rata-rata profilmu melebihi 7 poin dan 1,28 kali galat bakunya. Label tingkat (Perlu dikembangkan sampai Sangat kuat) memakai ambang 25, 45, 65, dan 80% dari skor terkoreksi dan bukan persentil.'),
        h('p', null, 'Gs, kelancaran Glr, dan kecepatan membaca memakai acuan kasar (misalnya 48 jawaban benar untuk 100% pada sprint perbandingan). Acuan ini perkiraan, bukan norma.'))),
      h('details', null, h('summary', null, 'Mengapa ini bukan tes IQ'), h('div', { class: 'stack' },
        h('p', null, 'Tes IQ klinis (WAIS, WJ IV, KABC-II, dan sejenisnya) dinormakan pada sampel representatif, diuji reliabilitas dan validitasnya, dan dilakukan oleh penguji terlatih dalam kondisi baku. Tes ini tidak punya semua itu. Yang dijaga adalah kesesuaian teorinya: struktur kemampuan, definisi, dan jenis tugas mengikuti CHC.'),
        h('p', null, 'Faktor yang bisa memengaruhi hasil: kantuk, kebisingan, perangkat (mouse, layar sentuh, audio), kebiasaan dengan format soal, dan motivasi. Untuk keputusan penting, temui psikolog berlisensi.'))),
      h('details', null, h('summary', null, 'Sumber teori'), h('div', { class: 'stack' },
        h('p', null, 'Carroll, J. B. (1993). Human cognitive abilities: A survey of factor-analytic studies. Cambridge University Press.'),
        h('p', null, 'McGrew, K. S. (2009). CHC theory and the human cognitive abilities project. Intelligence, 37(1), 1–10.'),
        h('p', null, 'Schneider, W. J., & McGrew, K. S. (2018). The Cattell-Horn-Carroll theory of cognitive abilities. Dalam D. P. Flanagan & E. M. McDonough (Eds.), Contemporary intellectual assessment (edisi ke-4). Guilford Press.')))),
    h('div', { class: 'row noprint' },
      h('button', { class: 'btn', onclick: copySummary }, 'Salin ringkasan'),

    h('textarea', { id: 'sumbox', class: 'field', hidden: true, 'aria-label': 'ringkasan hasil', style: 'min-height:160px;font-size:14px' })));
}
function summaryText() {
  const C = compute();
  return ['PROFIL KOGNITIF CHC (Berkas CHC-09), bukan IQ', ...C.list.map(A => `${A.ab} ${AB[A.ab].name}: ${pct(A.p)}% (90%: ${pct(A.lo)}-${pct(A.hi)}%), ${A.rel === 'up' ? 'kekuatan relatif' : A.rel === 'dn' ? 'area pengembangan' : 'selaras'}`), `Indeks kasar: ${pct(C.mean)}%`].join('\n');
}
function copySummary() {
  const t = summaryText(), box = $('#sumbox'), b = event && event.target;
  const fb = () => { box.hidden = false; box.value = t; box.select(); if (b) b.textContent = 'Ringkasan ada di kotak di bawah'; };
  try { navigator.clipboard.writeText(t).then(() => { if (b) b.textContent = 'Tersalin'; }, fb); } catch (e) { fb(); }
}

/* ========== start ========== */
load();
if (ST.pos >= N_STATIONS) showResults(); else introScreen();
